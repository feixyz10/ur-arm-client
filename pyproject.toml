[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ur-arm-client"
version = "0.1.0"
description = "Python client for Universal Robots arms over RTDE"
readme = "USER_GUIDE.md"
requires-python = ">=3.10"
dependencies = ["ur-rtde-py>=1.6.5"]

[dependency-groups]
dev = ["pytest>=8.4.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
